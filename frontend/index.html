<!doctype html>
<html lang="es-MX" data-theme="default">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEURONOTE · Rutas de calma y espacios sensoriales</title>
    <meta
      name="description"
      content="NEURONOTE ayuda a personas neurodivergentes y con sensibilidad sensorial a encontrar rutas peatonales más tranquilas, oasis sensoriales e información ambiental."
    />
    <meta name="theme-color" content="#184077" />
    <meta property="og:title" content="NEURONOTE · Find your calm. Find your way." />
    <meta
      property="og:description"
      content="Rutas más tranquilas, espacios de calma y una forma más cómoda de recorrer la ciudad."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Aplica las preferencias guardadas (solo existen si la persona dio su permiso)
      // antes del primer pintado, para evitar un destello de colores no deseados.
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem('nn-prefs') || 'null');
          if (!p) return;
          var r = document.documentElement;
          if (['default', 'calm', 'contrast', 'night'].indexOf(p.theme) > -1) r.dataset.theme = p.theme;
          if (['atkinson', 'opendyslexic', 'system'].indexOf(p.font) > -1) r.dataset.font = p.font;
          if ([1, 1.125, 1.25, 1.5].indexOf(p.textScale) > -1) r.style.setProperty('--text-scale', p.textScale);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>NEURONOTE necesita JavaScript para mostrar el mapa y las herramientas.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
