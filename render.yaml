# Render Blueprint — API de NEURONOTE (plan Free).
# Render → New → Blueprint → elige este repositorio. Los valores secretos
# (sync: false) se escriben en el panel de Render, nunca en este archivo.
# Nota: el plan Free se "duerme" tras 15 min sin tráfico y tarda ~1 min en despertar.
services:
  - type: web
    name: neuronote-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: CORS_ORIGIN
        sync: false # p. ej. https://neuronote.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 2h
      - key: SUPABASE_URL
        value: https://uerubfhrjspfiemgsufn.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: RESTCOUNTRIES_KEY
        sync: false
      - key: AUDIT_ENGINE_URL
        sync: false # URL pública de neuronote-audit, p. ej. https://neuronote-audit.onrender.com
      - key: SENTRY_DSN
        sync: false # opcional: monitoreo de errores (Sentry Developer, gratis)

  # Motor de auditoría PHP 8 (Docker). La base es TiDB Cloud Starter (compatible
  # con MySQL, gratis y sin tarjeta con límite de gasto 0); exige TLS.
  - type: web
    name: neuronote-audit
    runtime: docker
    plan: free
    rootDir: audit-engine
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /src/health.php
    envVars:
      - key: DB_HOST
        sync: false # gateway01.<región>.prod.aws.tidbcloud.com
      - key: DB_PORT
        value: "4000"
      - key: DB_NAME
        value: neuronote_audit
      - key: DB_USER
        sync: false # <prefijo>.root (lo muestra TiDB en "Connect")
      - key: DB_PASS
        sync: false
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASS_HASH
        sync: false
      - key: BADGE_SECRET
        generateValue: true
