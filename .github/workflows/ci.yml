# CI de NEURONOTE: cada push a main/develop y cada pull request ejecuta
# lint + pruebas + build de las tres partes. El despliegue lo hacen Vercel
# (frontend) y Render (API) automáticamente al llegar cambios a main.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Pruebas (Vitest + RTL + MSW) con cobertura mínima de 70 %
        run: npm run coverage
      - run: npm run build
        env:
          VITE_API_URL: https://neuronote-api.onrender.com/api
      - run: npm run build-storybook
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cobertura-frontend
          path: frontend/coverage/
          retention-days: 14

  backend:
    name: Backend (Express + Supertest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run coverage
      - name: La colección de Postman está al día con la especificación
        run: |
          npm run postman
          git diff --exit-code -- docs/neuronote-api.postman_collection.json \
            || (echo "::error::Ejecuta 'npm run postman' en backend/ y sube la colección actualizada." && exit 1)

  audit-engine:
    name: Motor de auditoría (PHP 8 + MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-solo-pruebas
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-solo-pruebas"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - name: Sintaxis de todos los archivos PHP
        run: find audit-engine -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Pruebas del ICAS
        run: php audit-engine/tests/icas_test.php
      - name: El esquema MySQL se crea sin errores
        run: mysql -h 127.0.0.1 -uroot -pci-solo-pruebas < audit-engine/db/schema.sql
      - name: La imagen Docker (Render) se construye y responde
        run: |
          docker build -t neuronote-audit audit-engine
          docker run -d --name audit --network host \
            -e PORT=8080 -e DB_HOST=127.0.0.1 -e DB_USER=root -e DB_PASS=ci-solo-pruebas -e DB_SSL_CA= \
            -e BADGE_SECRET=ci-solo-pruebas neuronote-audit
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8080/src/health.php && break; sleep 1; done
          set -x
          test "$(curl -s 'http://127.0.0.1:8080/src/verify.php?osm_id=way-1')" = '{"certified":false}'
          curl -s -X POST -d 'avg_db=40&peak_db=60&reverberation_s=0.5&lux=300&crowd_density=0.5' \
            http://127.0.0.1:8080/src/calculate_index.php | grep -q '"icas"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/src/bootstrap.php)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/.env)" = 404
          curl -s -D - -o /dev/null -H 'X-Forwarded-Proto: https' http://127.0.0.1:8080/src/health.php | grep -qi strict-transport
          ! curl -s -D - -o /dev/null http://127.0.0.1:8080/src/health.php | grep -qi 'x-powered-by'
      - name: Registros del contenedor
        if: failure()
        run: docker logs audit || true
