# Publica el catálogo de componentes (Storybook) en GitHub Pages.
# Gratis para repositorios públicos. Requiere activarlo una vez:
#   GitHub → Settings → Pages → Build and deployment → Source: "GitHub Actions"
# URL: https://<usuario>.github.io/neuronote-monorepo/
name: Storybook

on:
  push:
    branches: [main]
    paths:
      - 'frontend/src/**'
      - 'frontend/.storybook/**'
      - 'frontend/package*.json'
      - '.github/workflows/storybook.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una sola publicación a la vez; si llega otra, la anterior en curso termina.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Compilar Storybook
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build-storybook
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/storybook-static

  deploy:
    name: Publicar en GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
